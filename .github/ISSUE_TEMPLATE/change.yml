name: Propose a change
description: A new feature or a change to how something works.
labels: [needs-triage]
body:
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: What a user can do or see after the change.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem this solves, and who has it.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Results that show the change is complete, one per line.
    validations:
      required: true
