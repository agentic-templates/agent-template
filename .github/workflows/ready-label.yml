name: Ready label

on:
  issues:
    types: [labeled]

permissions: {}

jobs:
  # Removes a ready label that the definition of ready in docs/planning.md doesn't allow.
  # GitHub also sends a labeled event for each label that an issue is opened with.
  ready:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove ready if the definition of ready doesn't allow it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABELED_BY: ${{ github.event.sender.login }}
        run: scripts/check-ready-label
