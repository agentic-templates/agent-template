name: CI

on:
  pull_request:
  # The merge queue waits for the required check "check" on each group of pull requests that it tests.
  # The merge group tested the commit that lands on main, so a push to main starts no run.
  merge_group:

permissions:
  contents: read

# A new push to a pull request cancels the older run.
# Each group in the merge queue gets its own group, so GitHub never cancels a waiting run there.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    # Stops a stuck run. It's well above the time goal under "Commands" in AGENTS.md, so a slow run still finishes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail a pull request that adds a dependency with a known vulnerability.
      # The step compares the pull request with its base branch, so it runs only on pull requests.
      - name: Check new dependencies for known vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

      # scripts/install-check-tools holds each tool's version and checksum. uv installs the Python version in
      # .python-version and the packages in uv.lock when scripts/check first runs it.
      - name: Install shellcheck, actionlint, zizmor and uv
        run: |
          scripts/install-check-tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # zizmor uses the job's read-only token to check the actions in the workflows against GitHub's advisories.
      # SKIP_SCRIPT_TESTS skips the tests of the scripts and hooks, which the script-tests job runs.
      - run: scripts/check
        env:
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
          SKIP_SCRIPT_TESTS: 1

  # Says whether the change needs the tests of the scripts and hooks, as scripts/script-tests-needed decides from the
  # files it changes. When it can't list them, the tests run.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      script_tests: ${{ steps.decide.outputs.script_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GitHub's compare API lists at most 300 files, so a merge group with more runs the tests.
      - id: decide
        name: Decide whether the tests of the scripts and hooks run
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          paths=scripts/
          case $EVENT in
            pull_request)
              paths=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/files" \
                --jq '.[] | .filename, (.previous_filename // empty)') || paths=scripts/
              ;;
            merge_group)
              paths=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
                --jq 'if (.files | length) < 300 then (.files[] | .filename, (.previous_filename // empty)) else "scripts/" end') ||
                paths=scripts/
              ;;
          esac
          # Only code 1 means that the change doesn't need the tests.
          needed=0
          scripts/script-tests-needed <<<"$paths" || needed=$?
          script_tests=true
          if ((needed == 1)); then
            script_tests=false
          fi
          echo "script_tests=$script_tests" >>"$GITHUB_OUTPUT"

  # Runs the tests of the scripts and hooks while the linux job runs the other checks, because the tests took most of
  # the linux job's time. Each job of the matrix runs a part of the tests, as scripts/test-scripts --part describes.
  script-tests:
    needs: changes
    if: needs.changes.outputs.script_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1/2, 2/2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ShellCheck cases of scripts/test-check run shellcheck.
      # scripts/draft-assets.test runs actionlint and zizmor.
      - name: Install shellcheck, actionlint, zizmor and uv
        run: |
          scripts/install-check-tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # zizmor uses the job's read-only token, as in the linux job.
      - name: Run the tests of the scripts and hooks
        run: scripts/test-scripts --part "$PART"
        env:
          PART: ${{ matrix.part }}
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}

  # Runs the tests of the scripts and hooks with bash 3.2, the bash that macOS ships as /bin/bash. On a Mac without a
  # newer bash, the hooks and scripts/check run with it. The script-tests job's bash is newer, and shellcheck doesn't
  # flag what bash 3.2 lacks, such as declare -A.
  bash-3-2:
    needs: changes
    if: needs.changes.outputs.script_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The Docker library's image of the tag bash:3.2, which is bash 3.2.57 on Alpine 3.22.
    container:
      image: bash:3.2@sha256:0fd7cb8499c63a3c9345e7088a9cd83bb69f6e895e83833859aff838a0312091
    strategy:
      fail-fast: false
      matrix:
        part: [1/2, 2/2]
    steps:
      # Alpine keeps only the newest build of each package, so a pinned version would stop installing at its next
      # update. The image's digest fixes the Alpine release that the packages come from.
      # Some tests run scripts with PATH=/usr/bin:/bin, where macOS and Ubuntu have a bash.
      - name: Install git and jq, and make /bin/bash bash 3.2
        run: |
          apk add --no-cache git jq
          ln -s /usr/local/bin/bash /bin/bash

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's user owns the checkout, but the job runs as the container's root, and git refuses a repository
      # that another user owns.
      - name: Give the checkout to root
        run: chown -R root:root .

      - name: Run the tests of the scripts and hooks
        run: scripts/test-scripts --part "$PART"
        env:
          PART: ${{ matrix.part }}

  # Runs the tests of the scripts and hooks on macOS, with its /bin/bash 3.2 and the tools that it ships, which differ
  # from the GNU tools of Ubuntu and the BusyBox tools of the bash-3-2 job. For example, sed -i takes a backup suffix,
  # date has no -d, stat has -f in place of -c, wc pads its counts with spaces, and mktemp -d ignores TMPDIR.
  # It runs only in the merge queue, because GitHub's free plan runs at most 5 macOS jobs at once, and pull requests
  # whose checks ran at the same time waited for each other's macOS jobs. On a pull request it's skipped, so the
  # required checks don't wait for it.
  # With 2 parts, a merge group's run takes about 2 minutes, and the macOS jobs of 2 merge groups run at once. The pull
  # request that set the parts gives the measurements.
  macos:
    needs: changes
    if: github.event_name == 'merge_group' && needs.changes.outputs.script_tests == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1/2, 2/2]
    # With this PATH, the scripts' #!/usr/bin/env bash lines find /bin/bash.
    # macOS 15 and later have jq and git in /usr/bin.
    env:
      PATH: /usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Check that bash is 3.2
        run: |
          version=$(bash --version)
          version=${version%%$'\n'*}
          if [[ $version != *" version 3.2."* ]]; then
            echo "::error::bash --version reports \"$version\", and this job tests the scripts with bash 3.2, which macOS ships as /bin/bash. Make /bin/bash the first bash on the job's PATH."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the tests of the scripts and hooks
        run: scripts/test-scripts --part "$PART"
        env:
          PART: ${{ matrix.part }}

  # Fails a pull request or a merge group whose commits would publish a token, a private key, a socket path or a file
  # that holds secrets, as scripts/leak-scan finds them. CI has no private folders, and its home folder is a runner's,
  # so --generic leaves out the kinds that depend on the machine.
  leak-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The scan reads the commits between the base and the head, so it needs the history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # uv runs the scan with the Python version in .python-version.
      - name: Install shellcheck, actionlint, zizmor and uv
        run: |
          scripts/install-check-tools "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan the new commits for leaks
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: scripts/leak-scan --generic --range "$BASE..$HEAD"

  # The rules for main require a job named "check". If you rename it, change scripts/configure-github too.
  # It fails unless each job in needs passed or was skipped. When you add a job to this workflow, add it to needs.
  # It runs with if: always(), because otherwise a failed job would skip it, and GitHub counts a skip as a pass.
  check:
    needs: [changes, linux, script-tests, bash-3-2, macos, leak-scan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless each job in needs passed or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A job that check needs failed or was cancelled. That job's own check says why."
          exit 1
